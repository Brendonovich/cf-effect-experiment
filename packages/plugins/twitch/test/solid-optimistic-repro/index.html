<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solid 2 Twitch settings repro</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener("error", (event) => {
        document.body.textContent = event.error?.stack ?? event.message;
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.body.textContent = event.reason?.stack ?? String(event.reason);
      });
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

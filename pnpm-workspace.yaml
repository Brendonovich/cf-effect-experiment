  "@stylexjs/unplugin": 0.19.0
  effect: 4.0.0-beta.107
  "@effect/opentelemetry": 4.0.0-beta.107
  "@effect/platform-browser": 4.0.0-beta.107
  "@effect/platform-bun": 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/platform-node-shared": 4.0.0-beta.107
  "@effect/vitest": 4.0.0-beta.107
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@types/node@26.4.1"
patchedDependencies:
  "alchemy@2.0.0-beta.72": "patches/alchemy@2.0.0-beta.72.patch"
  "@solidjs/router@2.0.0-next.17": "patches/@solidjs__router@2.0.0-next.17.patch"

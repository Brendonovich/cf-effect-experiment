packages:
  - "packages/*"
  - "packages/workflow-runtime*/test-app"
  - "packages/modules/*"
  - "local-modules/*"
  - "apps/*"
  - "apps/cloud/frontend"
  - "apps/server/client"
allowBuilds:
  "@julusian/midi": true
  "@parcel/watcher": false
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  msgpackr-extract: true
  sharp: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  workerd: true
patchedDependencies:
  "@solidjs/router@2.0.0-next.17": patches/@solidjs__router@2.0.0-next.17.patch
  "@opencode/core@2.0.27": patches/@opencode__core@2.0.27.patch
  "@alchemy.run/cloudflare@2.0.0-beta.84": patches/@alchemy.run__cloudflare@2.0.0-beta.84.patch

catalog:
  "@stylexjs/stylex": 0.19.0
  "@stylexjs/unplugin": 0.19.0
  effect: 4.0.6
  "@effect/opentelemetry": 4.0.6
  "@effect/platform-browser": 4.0.6
  "@effect/platform-node": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@effect/vitest": 4.0.6
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@types/node@26.4.1"
overrides:
  "@types/node": 24.13.3

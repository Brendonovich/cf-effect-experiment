name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        run: pnpm typecheck && pnpm lint
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Test server production build
        run: pnpm test:integration

  unit-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run affected unit tests
        if: github.event_name == 'pull_request'
        run: pnpm test:affected
      - name: Run all unit tests
        if: github.event_name != 'pull_request'
        run: pnpm test:unit
      - name: Test verification diagnostics
        run: pnpm verify:test

  e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify playground in Chromium
        run: pnpm verify:playground
        env:
          MACROGRAPH_VERIFY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-chromium
      - name: Verify mobile queue selection in WebKit
        run: pnpm verify:playground:function-queues
        env:
          MACROGRAPH_VERIFY_BROWSER: webkit
          MACROGRAPH_VERIFY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-webkit
      - name: Upload playground verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrograph-playground-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/verify-macrograph/artifacts/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/
          if-no-files-found: warn

  validate:
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    needs: [quality, unit-tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success"

  playground-preview:
    needs: validate
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: playground-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CI: "true"
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate preview stage
        run: '[[ "$STAGE" =~ ^pr-[0-9]+$ ]]'
      - name: Deploy playground preview
        if: github.event.action != 'closed'
        working-directory: apps/playground
        run: pnpm alchemy deploy --stage "$STAGE" --yes
      - name: Destroy playground preview
        if: github.event.action == 'closed'
        working-directory: apps/playground
        run: pnpm alchemy destroy --stage "$STAGE" --yes

  server-image:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/macrograph-server
          flavor: latest=false
          tags: |
            type=raw,value=beta
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
          provenance: mode=max
          sbom: true

  deploy-production:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Production
        working-directory: apps/cloud
        run: pnpm alchemy deploy --stage production --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_ORG_ID: ${{ secrets.AXIOM_ORG_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_APP_ID: ${{ secrets.MACROGRAPH_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MACROGRAPH_GITHUB_APP_PRIVATE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
          PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
          STREAMLABS_CLIENT_ID: ${{ secrets.STREAMLABS_CLIENT_ID }}
          STREAMLABS_CLIENT_SECRET: ${{ secrets.STREAMLABS_CLIENT_SECRET }}

  deploy-opencode-bot:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-opencode-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy OpenCode Bot
        working-directory: apps/opencode-bot
        run: pnpm alchemy deploy --stage production --yes
        env:
          CI: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_AUTOFIX_WEBHOOK: ${{ secrets.DISCORD_AUTOFIX_WEBHOOK }}
          DISCORD_AUTOFIX_BOT_ID: ${{ secrets.DISCORD_AUTOFIX_BOT_ID }}
          GITHUB_API_TOKEN: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AUTOFIX_GITHUB_TOKEN }}
